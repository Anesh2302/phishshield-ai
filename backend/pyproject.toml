[project]
name = "phishshield-backend"
version = "0.1.0"
description = "PhishShield AI backend - multi-domain defensive cybersecurity platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: marks tests that need external services (postgres, providers)",
    "realprovider: marks tests that require real OAuth provider credentials",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/jobs/worker.py"]
